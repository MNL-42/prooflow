<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081B18">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>PROOFLOW</title>
<style>
:root{--bg:#081B18;--deep:#103B30;--br:#10B981;--mint:#D9FBEA;--ink:#F4F7F5;--mute:#9BAEA7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--br);text-decoration:none}h1,h2,h3{margin:0;font-weight:600}h1{font-size:21px}h2{font-size:14px;color:var(--mint)}
.top{position:sticky;top:0;z-index:5;background:rgba(8,27,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid #ffffff1a;padding:12px 16px;display:flex;gap:10px;align-items:baseline}.top span{color:var(--br)}.top small{color:var(--mute)}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px;display:grid;gap:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(16,59,48,.96);border-top:1px solid #ffffff1a;display:flex;justify-content:center;z-index:5}
nav a{flex:1;max-width:160px;text-align:center;padding:14px 4px;font-size:12px;color:var(--mute)}nav a.on{color:var(--br);font-weight:600}
.card{background:#ffffff0d;border:1px solid #ffffff1a;border-radius:16px;padding:14px;display:grid;gap:10px;color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.wrap{display:flex;flex-wrap:wrap;gap:8px}
.mute{color:var(--mute);font-size:13px}.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;color:var(--mute)}.r{text-align:right}.big{font-size:24px;font-weight:700}
input,select,textarea{width:100%;background:#103B3099;border:1px solid #ffffff1f;border-radius:12px;color:var(--ink);padding:11px 12px;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--br)}
label{display:grid;gap:4px;font-size:12px;color:var(--mute)}label.ck{display:flex;align-items:center;gap:8px;font-size:14px}label.ck input{width:auto}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;background:var(--br);color:var(--bg);cursor:pointer;text-align:center;display:inline-block}
.btn.g{background:transparent;border:1px solid #ffffff26;color:var(--ink)}.btn.d{background:#ef444426;color:#fca5a5}.btn.s{padding:7px 12px;font-size:13px}.btn.w{width:100%}
.badge{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px}.tabs button{flex:none;border:0;border-radius:99px;padding:7px 14px;background:#ffffff1a;color:var(--mute);font:inherit}.tabs button.on{background:var(--br);color:var(--bg)}
.ev{border-left:2px solid #10B98166;padding-left:10px}.warn{background:#fbbf2420;color:#fcd34d;border-radius:12px;padding:10px;font-size:13px}.lnk{word-break:break-all;background:#0006;border-radius:10px;padding:8px}
#print{display:none}@media print{body>*:not(#print){display:none!important}#print{display:block;background:#fff;color:#000;padding:24px;font-family:Arial,sans-serif}#print table{width:100%;border-collapse:collapse}#print td,#print th{border-bottom:1px solid #ccc;padding:6px;text-align:left}}
</style></head><body><div id="app"></div><div id="print"></div>
<script>
'use strict';
const KEY='prooflow.v1';
const ST={brouillon:['Brouillon','#9BAEA7'],en_attente:['En attente','#fbbf24'],validee:['Validée','#38bdf8'],en_cours:['En cours','#10B981'],en_revision:['En révision','#c084fc'],terminee:['Terminée','#D9FBEA'],livree:['Livrée','#34d399'],annulee:['Annulée','#f87171']};
const NEXT={brouillon:['en_attente','annulee'],en_attente:['validee','brouillon','annulee'],validee:['en_cours','annulee'],en_cours:['en_revision','terminee','annulee'],en_revision:['en_cours','terminee','annulee'],terminee:['livree','en_revision'],livree:[],annulee:[]};
const QL={brouillon:'Brouillon',envoye:'Envoyé au client',accepte:'Accepté',refuse:'Refusé'};
const TABS=[['all','Toutes',[]],['wait','En attente',['brouillon','en_attente']],['run','En cours',['validee','en_cours']],['rev','En révision',['en_revision']],['done','Terminées',['terminee']],['dlv','Livrées',['livree']]];
const fresh=()=>({biz:{name:'',phone:'',cur:'USD'},customers:[],services:[]});
let D;try{D=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){D=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){alert('Impossible d’enregistrer (stockage plein ou bloqué). Faites une sauvegarde dans Réglages.')}}
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const money=(n,c)=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:c||D.biz.cur||'USD'}).format(+n||0);
const fd=d=>d?new Date(d).toLocaleDateString('fr-FR'):'—';
const fdt=d=>d?new Date(d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):'—';
const sv=id=>D.services.find(s=>s.id===id),cu=id=>D.customers.find(c=>c.id===id);
const paid=s=>s.payments.reduce((a,p)=>a+p.amt,0),qtot=s=>s.quote?s.quote.items.reduce((a,i)=>a+i.q*i.p,0):0;
const digits=p=>(p||'').replace(/\D/g,''),now=()=>new Date().toISOString();
const badge=s=>`<span class="badge" style="color:${ST[s][1]}">${ST[s][0]}</span>`;
const enc=o=>{const b=new TextEncoder().encode(JSON.stringify(o));let s='';b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const dec=t=>{t=t.replace(/-/g,'+').replace(/_/g,'/');const s=atob(t);return JSON.parse(new TextDecoder().decode(Uint8Array.from(s,c=>c.charCodeAt(0))))};
var ui={tab:'all',cform:null,sform:false,open:null,link:null,msg:0};
var A={};
const shell=(h,tab)=>`<header class="top"><b>PROOF<span>FLOW</span></b><small>${esc(D.biz.name)}</small></header><main>${h}</main><nav>${[['/','Accueil'],['/s','Prestations'],['/c','Clients'],['/r','Réglages']].map(([p,l])=>`<a href="#${p}" class="${tab===p?'on':''}">${l}</a>`).join('')}</nav>`;
const sec=(t,h)=>`<section class="card"><h2>${t}</h2>${h}</section>`;
const empty=t=>`<p class="mute" style="text-align:center;padding:14px">${t}</p>`;

function vSetup(){return `<main style="padding-top:40px"><h1 style="text-align:center">PROOF<span style="color:var(--br)">FLOW</span></h1><p class="mute" style="text-align:center">Chaque prestation mérite une preuve.</p>
<form class="card" onsubmit="A.biz(event)"><h2>Votre entreprise</h2><label>Nom de l’entreprise<input name="n" required value="${esc(D.biz.name)}"></label>
<label>Votre numéro WhatsApp (avec indicatif, ex. 243…)<input name="p" inputmode="tel" value="${esc(D.biz.phone)}"></label>
<label>Devise<select name="c">${['USD','CDF','EUR','XOF','XAF'].map(c=>`<option ${D.biz.cur===c?'selected':''}>${c}</option>`).join('')}</select></label><button class="btn w">Enregistrer</button></form></main>`}
function vDash(){const S=D.services,n=(...a)=>S.filter(s=>a.includes(s.status)).length,tp=S.reduce((a,s)=>a+paid(s),0),rest=S.filter(s=>s.status!=='annulee').reduce((a,s)=>a+Math.max(0,s.price-paid(s)),0);
const ev=S.flatMap(s=>s.events.map(e=>({...e,s}))).sort((a,b)=>b.at.localeCompare(a.at)).slice(0,8);
const st=(l,v)=>`<div class="card"><span class="mute">${l}</span><span class="big">${v}</span></div>`;
return shell(`<div class="g2">${st('Prestations',S.length)}${st('Clients',D.customers.length)}${st('En cours',n('validee','en_cours','en_revision'))}${st('En attente',n('brouillon','en_attente'))}${st('Terminées / livrées',n('terminee','livree'))}${st('Encaissé',money(tp))}</div>
<div class="card row"><span class="mute">Reste à encaisser</span><b>${money(rest)}</b></div>
<div class="wrap"><a class="btn" href="#/s" onclick="ui.sform=true">Nouvelle prestation</a><a class="btn g" href="#/c">Clients</a></div>
${sec('Activité récente',ev.length?ev.map(e=>`<a href="#/s/${e.s.id}" class="row" style="color:var(--ink)"><span>${esc(e.title)} <span class="mono">${e.s.ref}</span></span><span class="mute">${fdt(e.at)}</span></a>`).join(''):empty('Aucune activité pour l’instant.'))}`,'/')}
function vClients(){const f=ui.cform;
return shell(`<div class="wrap" style="flex-wrap:nowrap"><input placeholder="Rechercher un client…" oninput="A.find(this.value)"><button class="btn" onclick="A.cNew()">Ajouter</button></div>
${f?`<form class="card" onsubmit="A.cSave(event)"><h2>${f.id?'Modifier':'Nouveau'} client</h2><label>Nom complet<input name="n" required value="${esc(f.n)}"></label><label>Téléphone WhatsApp (avec indicatif)<input name="p" inputmode="tel" value="${esc(f.p)}"></label><label>E-mail<input name="e" type="email" value="${esc(f.e)}"></label><label>Notes internes (jamais partagées)<textarea name="t" rows="2">${esc(f.t)}</textarea></label><div class="wrap"><button class="btn">Enregistrer</button><button type="button" class="btn g" onclick="ui.cform=null;render()">Annuler</button></div></form>`:''}
${D.customers.length?[...D.customers].sort((a,b)=>a.n.localeCompare(b.n)).map(c=>{const ss=D.services.filter(s=>s.cid===c.id);return `<div class="card cl" data-n="${esc(c.n.toLowerCase())}"><div class="row"><div onclick="ui.open=ui.open==='${c.id}'?null:'${c.id}';render()" style="cursor:pointer"><b>${esc(c.n)}</b><div class="mute">${esc(c.p||c.e||'—')} · ${ss.length} prestation(s)</div></div><button class="btn g s" onclick="A.cEdit('${c.id}')">Modifier</button></div>
${ui.open===c.id?(ss.length?ss.map(s=>`<a href="#/s/${s.id}" class="row" style="color:var(--ink)"><span>${esc(s.title)} <span class="mono">${s.ref}</span></span>${badge(s.status)}</a>`).join(''):empty('Aucune prestation.'))+`<a class="btn g w" href="#/s" onclick="ui.sform=true;ui.pre='${c.id}'">Nouvelle prestation</a>`:''}</div>`}).join(''):empty('Aucun client. Ajoutez votre premier client.')}`,'/c')}
function vServices(){const st=TABS.find(t=>t[0]===ui.tab)[2],L=D.services.filter(s=>!st.length||st.includes(s.status)).sort((a,b)=>b.created.localeCompare(a.created));
return shell(`<button class="btn w" onclick="ui.sform=!ui.sform;render()">${ui.sform?'Fermer':'Nouvelle prestation'}</button>
${ui.sform?(D.customers.length?`<form class="card" onsubmit="A.sNew(event)"><label>Client<select name="c" required><option value="">Choisir…</option>${D.customers.map(c=>`<option value="${c.id}" ${ui.pre===c.id?'selected':''}>${esc(c.n)}</option>`).join('')}</select></label><label>Titre (ex. Écran iPhone 12)<input name="t" required></label><label>Description (visible du client)<textarea name="d" rows="2"></textarea></label><div class="g2"><label>Prix<input name="p" type="number" min="0" step="0.01" inputmode="decimal"></label><label>Date prévue<input name="du" type="date"></label></div><label>Notes internes (privées)<textarea name="n" rows="2"></textarea></label><button class="btn w">Créer</button></form>`:`<div class="card">Ajoutez d’abord un client. <a href="#/c">Aller aux clients</a></div>`):''}
<div class="tabs">${TABS.map(t=>`<button class="${ui.tab===t[0]?'on':''}" onclick="ui.tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>
${L.length?L.map(s=>`<a class="card" href="#/s/${s.id}"><div class="row"><div><b>${esc(s.title)}</b><div class="mute">${esc((cu(s.cid)||{}).n)} · <span class="mono">${s.ref}</span></div></div>${badge(s.status)}</div><span class="mute">${money(s.price)} · échéance ${fd(s.due)}</span></a>`).join(''):empty('Aucune prestation dans cette vue.')}`,'/s')}
function vService(id){const s=sv(id);if(!s)return shell(empty('Prestation introuvable.')+'<a class="btn g w" href="#/s">Retour</a>','/s');const c=cu(s.cid)||{n:'?'},q=s.quote,p=paid(s);
const link=ui.link&&ui.link.id===id?ui.link.url:null,M=[['Lien de suivi',l=>`Bonjour ${c.n}, suivez votre prestation « ${s.title} » (réf. ${s.ref}) chez ${D.biz.name} ici : ${l}`],['Devis prêt',l=>`Bonjour ${c.n}, votre devis pour « ${s.title} » est prêt. Consultez-le et donnez votre accord ici : ${l}`],['Travail terminé',l=>`Bonjour ${c.n}, votre prestation « ${s.title} » est terminée. Confirmez la réception ici : ${l}`]];
return shell(`<a href="#/s" class="mute">← Prestations</a>
<div class="row"><div><h1>${esc(s.title)}</h1><div class="mute">${esc(c.n)} · <span class="mono">${s.ref}</span></div></div>${badge(s.status)}</div>
<div class="wrap">${NEXT[s.status].map(n=>`<button class="btn ${n==='annulee'?'d':'g'} s" onclick="A.st('${id}','${n}')">→ ${ST[n][0]}</button>`).join('')}</div>
${sec('Informations',`<form onsubmit="A.info(event,'${id}')" style="display:grid;gap:10px"><label>Titre<input name="t" required value="${esc(s.title)}"></label><label>Description (visible du client)<textarea name="d" rows="2">${esc(s.desc)}</textarea></label><div class="g2"><label>Prix<input name="p" type="number" min="0" step="0.01" value="${s.price}"></label><label>Échéance<input name="du" type="date" value="${esc(s.due)}"></label></div><label>Livraison (visible du client)<input name="dl" value="${esc(s.delivery)}"></label><label>Notes internes — jamais partagées<textarea name="n" rows="2">${esc(s.notes)}</textarea></label><button class="btn w">Enregistrer</button></form>`)}
${sec('Événements',`<form onsubmit="A.ev(event,'${id}')" style="display:grid;gap:8px"><div class="g2"><select name="k">${['Validation','Début du travail','Modification','Révision','Terminaison','Livraison','Note'].map(x=>`<option>${x}</option>`).join('')}</select><input name="t" required placeholder="Titre"></div><textarea name="m" rows="2" placeholder="Détail (optionnel)"></textarea><label class="ck"><input type="checkbox" name="v" checked> Visible par le client</label><button class="btn g w">Ajouter</button></form>${s.events.length?[...s.events].reverse().map(e=>`<div class="ev"><div>${esc(e.title)} ${e.vis?'':'<span class="mute">(privé)</span>'}</div>${e.msg?`<div class="mute">${esc(e.msg)}</div>`:''}<div class="mute">${fdt(e.at)}</div></div>`).join(''):empty('Aucun événement.')}`)}
${sec('Devis',!q?`<button class="btn g w" onclick="A.qNew('${id}')">Créer un devis</button>`:`<p>Statut : <b>${QL[q.status]}</b>${q.decidedAt?` · décision enregistrée le ${fdt(q.decidedAt)}`:''}</p>${q.items.map((i,k)=>`<div class="row"><span>${i.q} × ${esc(i.l)}</span><span>${money(i.q*i.p)} ${q.status==='brouillon'?`<a href="#" onclick="A.qDel('${id}',${k});return false" style="color:#fca5a5">✕</a>`:''}</span></div>`).join('')}<p class="r"><b>Total ${money(qtot(s))}</b></p>
${q.status==='brouillon'?`<form onsubmit="A.qAdd(event,'${id}')" class="g2"><input name="l" required placeholder="Ligne" style="grid-column:1/3"><input name="q" type="number" step="0.01" min="0.01" value="1"><input name="p" type="number" step="0.01" min="0" required placeholder="Prix unit."><button class="btn g" style="grid-column:1/3">+ Ajouter la ligne</button></form><button class="btn w" ${q.items.length?'':'disabled'} onclick="A.qSet('${id}','envoye')">Marquer comme envoyé au client</button>`:''}
${q.status==='envoye'?`<p class="mute">Quand le client répond (WhatsApp, oral…), enregistrez sa décision :</p><div class="wrap"><button class="btn s" onclick="A.qSet('${id}','accepte')">Le client accepte</button><button class="btn d s" onclick="A.qSet('${id}','refuse')">Le client refuse</button><button class="btn g s" onclick="A.qSet('${id}','brouillon')">Rouvrir</button></div>`:''}
${q.items.length&&qtot(s)!==+s.price?`<button class="btn g s" onclick="A.qPrice('${id}')">Utiliser le total du devis comme prix</button>`:''}`)}
${sec('Paiements (enregistrés manuellement)',`<p>Prix ${money(s.price)} · payé ${money(p)} · <b style="color:var(--br)">solde ${money(s.price-p)}</b></p><form onsubmit="A.pay(event,'${id}')" class="g2"><input name="a" type="number" step="0.01" min="0.01" required placeholder="Montant"><select name="m"><option value="Espèces">Espèces</option><option value="Mobile money">Mobile money</option><option value="Virement">Virement</option><option value="Autre">Autre</option></select><input name="d" type="date"><input name="r" placeholder="Référence (optionnel)"><button class="btn g" style="grid-column:1/3">Enregistrer le paiement</button></form>${s.payments.map((x,k)=>`<div class="row"><span>${fd(x.date)} · ${esc(x.method)}${x.ref?' · '+esc(x.ref):''}</span><span><b>${money(x.amt)}</b> <a href="#" onclick="A.payDel('${id}',${k});return false" style="color:#fca5a5">✕</a></span></div>`).join('')}`)}
${sec('Facture',!s.inv?`<button class="btn g w" onclick="A.inv('${id}','emise')">Générer la facture (${money(s.price)})</button>`:`<p><span class="mono">${esc(s.inv.no)}</span> · ${money(s.price)} · <b>${{emise:'Émise',payee:'Payée',annulee:'Annulée'}[s.inv.status]}</b></p><div class="wrap">${['emise','payee','annulee'].filter(x=>x!==s.inv.status).map(x=>`<button class="btn g s" onclick="A.inv('${id}','${x}')">${{emise:'Marquer émise',payee:'Marquer payée',annulee:'Annuler'}[x]}</button>`).join('')}<button class="btn s" onclick="A.print('${id}')">Imprimer / PDF</button></div>`)}
${sec('PROOFLOW PASS (lien client)',`<p class="mute">Le lien contient une copie des informations autorisées (jamais vos notes internes). Régénérez-le après chaque mise à jour importante.</p><button class="btn w" onclick="A.pass('${id}')">${link?'Mettre à jour le lien':'Générer le lien'}</button>${link?`<div class="lnk mono">${esc(link)}</div><select onchange="ui.msg=+this.value;render()">${M.map((m,i)=>`<option value="${i}" ${ui.msg===i?'selected':''}>${m[0]}</option>`).join('')}</select><div class="wrap"><a class="btn" target="_blank" rel="noopener" href="https://wa.me/${digits(c.p)}?text=${encodeURIComponent(M[ui.msg][1](link))}">Envoyer sur WhatsApp</a><button class="btn g" onclick="navigator.clipboard&&navigator.clipboard.writeText(ui.link.url).then(()=>alert('Lien copié'))">Copier</button></div>${c.p?'':'<p class="warn">Ce client n’a pas de numéro : WhatsApp vous laissera choisir le contact.</p>'}`:''}`)}
<button class="btn d w" onclick="A.sDel('${id}')">Supprimer cette prestation</button>`,'/s')}
function vSettings(){return shell(`<form class="card" onsubmit="A.biz(event)"><h2>Mon entreprise</h2><label>Nom<input name="n" required value="${esc(D.biz.name)}"></label><label>Numéro WhatsApp (avec indicatif)<input name="p" inputmode="tel" value="${esc(D.biz.phone)}"></label><label>Devise<select name="c">${['USD','CDF','EUR','XOF','XAF'].map(c=>`<option ${D.biz.cur===c?'selected':''}>${c}</option>`).join('')}</select></label><button class="btn w">Enregistrer</button></form>
${sec('Sauvegarde',`<p class="warn">Vos données sont stockées uniquement sur ce téléphone. Si vous effacez les données du navigateur, elles sont perdues : faites des sauvegardes régulières.</p><button class="btn w" onclick="A.exp()">Télécharger une sauvegarde</button><label>Restaurer une sauvegarde<input type="file" accept=".json,application/json" onchange="A.imp(this)"></label>`)}
${sec('Installer l’application','<p class="mute">Dans Chrome : menu ⋮ → « Ajouter à l’écran d’accueil ».</p>')}
${sec('Informations',`<p class="mute">Les confirmations de clients sont des preuves pratiques horodatées, pas des signatures électroniques certifiées. PROOFLOW n’encaisse aucun paiement.</p>`)}
<button class="btn d w" onclick="A.reset()">Effacer toutes les données</button>`,'/r')}
function vPass(t){let d;try{d=dec(t)}catch(e){return `<main style="padding-top:40px"><div class="card"><h1>Lien invalide</h1><p class="mute">Ce lien est incomplet ou abîmé. Demandez-en un nouveau à votre prestataire.</p></div></main>`}
const rest=d.pr-d.pd,wa=(m)=>`https://wa.me/${digits(d.bp)}?text=${encodeURIComponent(m)}`,stamp=new Date().toLocaleString('fr-FR');
return `<main><p class="mute" style="text-align:center">PROOFLOW PASS · ${esc(d.b)}</p>
<section class="card"><div class="row"><h1>${esc(d.t)}</h1>${ST[d.st]?badge(d.st):''}</div><span class="mono">${esc(d.ref)}</span>${d.d?`<p>${esc(d.d)}</p>`:''}<p class="mute">Client : ${esc(d.c)}${d.du?` · échéance ${fd(d.du)}`:''}</p>${d.dl?`<p>Livraison : ${esc(d.dl)}</p>`:''}<p>Prix ${money(d.pr,d.cur)} · payé ${money(d.pd,d.cur)} · <b style="color:var(--br)">reste ${money(rest,d.cur)}</b></p></section>
${d.q?sec('Devis',d.q.i.map(i=>`<div class="row"><span>${i.q} × ${esc(i.l)}</span><span>${money(i.q*i.p,d.cur)}</span></div>`).join('')+`<p class="r"><b>Total ${money(d.q.i.reduce((a,i)=>a+i.q*i.p,0),d.cur)}</b></p>`+(d.q.s==='envoye'?(d.bp?`<a class="btn w" href="${wa(`Bonjour, j’accepte le devis de la prestation ${d.ref} (${d.t}). Message envoyé le ${stamp}.`)}">J’accepte le devis</a><a class="btn d w" href="${wa(`Bonjour, je refuse le devis de la prestation ${d.ref} (${d.t}). Message envoyé le ${stamp}.`)}">Je refuse</a>`:'<p class="mute">Contactez votre prestataire pour répondre.</p>'):`<p class="mute">Devis ${d.q.s==='accepte'?'accepté':'refusé'}${d.q.dt?' le '+fdt(d.q.dt):''}.</p>`)):''}
${d.st==='terminee'&&d.bp?`<a class="btn w" href="${wa(`Bonjour, je confirme avoir bien reçu le travail de la prestation ${d.ref} (${d.t}). Message envoyé le ${stamp}.`)}">Je confirme la réception du travail</a>`:''}
${sec('Suivi',d.ev.length?d.ev.map(e=>`<div class="ev"><div>${esc(e.t)}</div>${e.m?`<div class="mute">${esc(e.m)}</div>`:''}<div class="mute">${fdt(e.a)}</div></div>`).join(''):empty('Aucune mise à jour.'))}
<p class="mute" style="text-align:center">Informations arrêtées au ${fdt(d.at)}. Vos réponses passent par WhatsApp et sont enregistrées avec leur date par votre prestataire ; ce ne sont pas des signatures électroniques certifiées.</p></main>`}

function render(){const h=location.hash.slice(1)||'/',a=$('#app');let o;
try{if(h.startsWith('/p/'))o=vPass(h.slice(3));else if(!D.biz.name)o=vSetup();else if(h==='/')o=vDash();else if(h==='/s')o=vServices();else if(h.startsWith('/s/'))o=vService(h.slice(3));else if(h==='/c')o=vClients();else if(h==='/r')o=vSettings();else o=vDash()}
catch(e){o='<main><div class="card"><h1>Erreur</h1><p class="mute">'+esc(e.message)+'</p><a class="btn" href="#/">Accueil</a></div></main>'}
a.innerHTML=o}
window.addEventListener('hashchange',()=>{ui.link=null;render();scrollTo(0,0)});
const fv=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
A.biz=e=>{const f=fv(e);D.biz={name:f.n.trim(),phone:digits(f.p),cur:f.c};save();render()};
A.find=v=>{v=v.toLowerCase();document.querySelectorAll('.cl').forEach(x=>x.style.display=x.dataset.n.includes(v)?'':'none')};
A.cNew=()=>{ui.cform={n:'',p:'',e:'',t:''};render()};
A.cEdit=id=>{const c=cu(id);ui.cform={id,n:c.n,p:c.p,e:c.e,t:c.t};render()};
A.cSave=e=>{const f=fv(e),o={n:f.n.trim(),p:f.p.trim(),e:f.e.trim(),t:f.t};if(ui.cform.id)Object.assign(cu(ui.cform.id),o);else D.customers.push({id:uid(),...o});ui.cform=null;save();render()};
A.sNew=e=>{const f=fv(e),s={id:uid(),ref:'PF-'+Math.random().toString(36).slice(2,6).toUpperCase(),cid:f.c,title:f.t.trim(),desc:f.d,notes:f.n,price:+f.p||0,due:f.du,delivery:'',status:'brouillon',created:now(),events:[{title:'Prestation créée',msg:'',vis:true,at:now()}],quote:null,payments:[],inv:null};D.services.push(s);ui.sform=false;ui.pre=null;save();location.hash='/s/'+s.id};
A.st=(id,n)=>{const s=sv(id);if(!NEXT[s.status].includes(n))return alert('Changement de statut non autorisé.');if(!confirm('Passer à « '+ST[n][0]+' » ?'))return;s.events.push({title:'Statut : '+ST[n][0],msg:'',vis:true,at:now()});s.status=n;save();render()};
A.info=(e,id)=>{const f=fv(e),s=sv(id);Object.assign(s,{title:f.t.trim(),desc:f.d,price:+f.p||0,due:f.du,delivery:f.dl,notes:f.n});save();render()};
A.ev=(e,id)=>{const f=fv(e);sv(id).events.push({title:f.t.trim(),msg:f.m,vis:!!f.v,at:now()});save();render()};
A.qNew=id=>{sv(id).quote={items:[],status:'brouillon',decidedAt:null};save();render()};
A.qAdd=(e,id)=>{const f=fv(e);sv(id).quote.items.push({l:f.l.trim(),q:+f.q,p:+f.p});save();render()};
A.qDel=(id,k)=>{sv(id).quote.items.splice(k,1);save();render()};
A.qSet=(id,st)=>{const s=sv(id),L={envoye:'Devis envoyé au client',accepte:'Devis accepté par le client (enregistré manuellement)',refuse:'Devis refusé par le client (enregistré manuellement)',brouillon:'Devis rouvert'};s.quote.status=st;s.quote.decidedAt=(st==='accepte'||st==='refuse')?now():null;s.events.push({title:L[st],msg:'',vis:true,at:now()});save();render()};
A.qPrice=id=>{const s=sv(id);s.price=qtot(s);save();render()};
A.pay=(e,id)=>{const f=fv(e);sv(id).payments.push({amt:+f.a,method:f.m,date:f.d||now().slice(0,10),ref:f.r});save();render()};
A.payDel=(id,k)=>{if(confirm('Supprimer ce paiement ?')){sv(id).payments.splice(k,1);save();render()}};
A.inv=(id,st)=>{const s=sv(id);s.inv=s.inv?{...s.inv,status:st}:{no:'F-'+s.ref,status:st,at:now()};save();render()};
A.pass=id=>{const s=sv(id);ui.link={id,url:location.origin+location.pathname+'#/p/'+enc((()=>{const c=cu(s.cid);return{v:1,b:D.biz.name,bp:D.biz.phone,ref:s.ref,t:s.title,d:s.desc,st:s.status,pr:s.price,cur:D.biz.cur,du:s.due,dl:s.delivery,c:c?c.n:'',pd:paid(s),at:now(),ev:s.events.filter(x=>x.vis).map(x=>({t:x.title,m:x.msg,a:x.at})),q:s.quote&&s.quote.status!=='brouillon'?{i:s.quote.items,s:s.quote.status,dt:s.quote.decidedAt}:null}})())};render()};
A.print=id=>{const s=sv(id),c=cu(s.cid)||{n:''},L=s.quote&&s.quote.items.length?s.quote.items:[{l:s.title,q:1,p:s.price}],p=paid(s);
$('#print').innerHTML=`<h1>${esc(D.biz.name)}</h1><p>Facture <b>${esc(s.inv.no)}</b> — ${fd(s.inv.at)}<br>Client : ${esc(c.n)}<br>Prestation : ${esc(s.title)} (${s.ref})</p><table><tr><th>Désignation</th><th>Qté</th><th>P.U.</th><th>Total</th></tr>${L.map(i=>`<tr><td>${esc(i.l)}</td><td>${i.q}</td><td>${money(i.p)}</td><td>${money(i.q*i.p)}</td></tr>`).join('')}</table><p><b>Total : ${money(s.price)}</b><br>Payé : ${money(p)}<br><b>Reste à payer : ${money(s.price-p)}</b></p>`;window.print()};
A.sDel=id=>{if(confirm('Supprimer définitivement cette prestation ?')){D.services=D.services.filter(s=>s.id!==id);save();location.hash='/s'}};
A.exp=()=>{const b=new Blob([JSON.stringify(D)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='prooflow-sauvegarde-'+now().slice(0,10)+'.json';a.click()};
A.imp=inp=>{const f=inp.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(!o.biz||!Array.isArray(o.customers)||!Array.isArray(o.services))throw 0;if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){D=o;save();render()}}).catch(()=>alert('Fichier de sauvegarde invalide.'))};
A.reset=()=>{if(confirm('Effacer TOUTES les données de ce téléphone ? (irréversible)')&&confirm('Vraiment tout effacer ?')){D=fresh();save();location.hash='/';render()}};
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
